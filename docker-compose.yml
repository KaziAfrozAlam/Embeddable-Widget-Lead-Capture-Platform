# One-command run: PostgreSQL + API + background worker + migrations + seed.
#   docker compose up --build
# The "customer site" already lives in ./website — serve it on your own host:
#   docker compose run --rm -p 5500:5500 api python -m http.server 5500 --directory website
name: flyrank-capstone-widget-platform

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-change-me}
      API_BASE_URL: http://localhost:8000
      GEO_MODE: live
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m app.services.worker
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      SECRET_KEY: ${SECRET_KEY:-compose-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata: